services:
  - type: web
    name: butterfly
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # As of 2026-09-02, Render runs proxy_app:app purely as a redirect shim (see that file's own
    # docstring) - the real app is hosted on the player's own machine behind a permanent named
    # Cloudflare tunnel at https://forkingpaths.app (see start_local_site.ps1 and NOTES.md). No env
    # var to keep updating here anymore - the redirect target is a fixed domain now, not an
    # ephemeral tunnel URL (LOCAL_TUNNEL_URL, previously required here, is gone - the quick-tunnel
    # era it belonged to is over).
    startCommand: gunicorn proxy_app:app --timeout 900 --worker-class gthread --threads 4
    envVars:
      # Everything below this line (API keys, FLASK_SECRET_KEY, Discord OAuth settings, the Ollama
      # tunnel settings) is now only relevant to the LOCAL machine's own .env - proxy_app.py has no
      # database, no provider calls, and no session logic of its own, so none of these are read by
      # anything running on Render anymore. Left commented here (rather than deleted outright) purely
      # as a record of what this service used to need before the hosting move - see NOTES.md. If
      # hosting ever moves back to Render running server:app directly, uncomment these and restore
      # the old startCommand.
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: FLASK_SECRET_KEY
      #   generateValue: true
      # - key: DISCORD_CLIENT_ID
      #   sync: false
      # - key: DISCORD_CLIENT_SECRET
      #   sync: false
      # - key: DISCORD_REDIRECT_URI
      #   sync: false
      # - key: OLLAMA_TUNNEL_URL
      #   sync: false
      # - key: OLLAMA_TUNNEL_SECRET
      #   sync: false
